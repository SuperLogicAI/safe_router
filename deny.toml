# cargo-deny config (CLAUDE.md: "cargo-audit and cargo-deny run in CI").
# Minimal deliberately — three checks, not a policy engine: known-license
# allowlist, no duplicate/unknown registries, no wildcard version deps.

[graph]
targets = []

[advisories]
version = 2
ignore = []

[licenses]
version = 2
# Every license actually present in `cargo metadata` for this lockfile
# (checked 2026-08-13), not a generic template. Re-run `cargo deny check
# licenses` after adding a dependency — a new license family means a
# deliberate addition here, not a silent widen.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-3-Clause",
    "BSL-1.0",
    "Zlib",
    "CC0-1.0",
    "MIT-0",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
